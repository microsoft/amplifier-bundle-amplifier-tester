name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal read-only token -- no secrets needed or exposed.
# Safe for Dependabot PRs and external fork contributors.
permissions:
  contents: read

# There are no path filters anywhere in this file, on purpose. A path filter
# that does not match leaves a check silently absent, which is
# indistinguishable from a passing one. No step swallows its exit code
# either: no error-suppressing job or step directive, and no shell fallback
# that discards a non-zero status. Every step's exit code is the gate. These
# jobs are seconds long; they run on every push and PR.
#
# Nothing here needs an API key and nothing here calls a model: the whole gate
# is filesystem-local. The evaluation harness under .amplifier/evaluations/ is
# deliberately NOT wired in -- it launches a Digital Twin Universe and spends
# real money per run, which is not something a push should do.

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Lint -- pyflakes + pycodestyle errors across the whole repo.
  #
  # This repo carries no pyproject.toml, no [tool.ruff] config and no uv.lock,
  # so the sibling template's `uv sync --frozen --only-group dev && uv run
  # ruff` shape does not apply. The tool and the rule set are both pinned
  # here instead:
  #
  #   * ruff 0.16.6      -- pinned so a future ruff release cannot turn this
  #                         red without a visible change to this file. Same
  #                         pin as the sibling bundles wayfinder and
  #                         browser-tester.
  #   * --isolated       -- ignore any ruff config, including one added later,
  #                         so the gate means the same thing every run.
  #   * --select E4,E7,E9,F
  #                      -- ruff's own classic default tier: pycodestyle
  #                         errors plus pyflakes (undefined names, unused
  #                         imports, f-string bugs). Real breakage, not style.
  #
  # Verified clean on main @40c9da3 before this workflow was written, so this
  # gate goes in green rather than arriving red on somebody else's code.
  #
  # `ruff format --check` is deliberately NOT run: at 40c9da3 it reports 2
  # files would be reformatted (tests/test_lean_head_guardrail.py and
  # .amplifier/evaluations/.../metrics/extract_metrics.py). Reformatting
  # source is out of scope for a workflow-only PR. Ruff's FULL default rule
  # set is likewise not selected: it reports 6 findings, all ISC/other style
  # tiers, none of them breakage. Both are stated in the PR body rather than
  # hidden by a narrowed selection.
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `enable-cache:`. It caches keyed on **/uv.lock, and this repo
      # commits no lockfile anywhere, so setup-uv HARD-FAILS the step with
      # "No file matched to [**/uv.lock]" -- a sibling lane observed exactly
      # that turn its first red-proof run into a setup error before ruff or
      # pytest ever ran, which is a red that proves nothing. (Note also that
      # `enable-caching:` is not a valid input at all and is silently
      # ignored; do not "fix" one into the other.) These jobs install a
      # handful of small wheels; the cache was never worth a failure mode.
      - uses: astral-sh/setup-uv@v4

      - name: Lint (ruff, pinned)
        run: uvx ruff@0.16.6 check --isolated --select E4,E7,E9,F .

  # ────────────────────────────────────────────────────────────────────────
  # Tests -- the repo's own standing test command, verbatim from the suite's
  # module docstring ("Run with `python3 -m pytest tests/ -q` from the repo
  # root"), so CI and local mean the same thing. There is no Makefile and no
  # check target in AGENTS.md, so that docstring IS the standing command.
  #
  # This is the REAL suite, not an import smoke: tests/test_lean_head_
  # guardrail.py, 18 tests, is the drift guardrail for
  # context/amplifier-tester-awareness.md -- the byte pin against the
  # measured v1 lean head, the per-artifact char budget, the fidelity
  # enumeration (rules + verbatim delegation forms), and the volatile-token
  # check. It landed in #16 with nothing executing it. This job is what
  # executes it.
  #
  # `--no-project` / `--isolated`: this repo ships no pyproject.toml and no
  # uv.lock, so there is nothing for uv to sync. The suite is pure-Python and
  # dependency-light by design (its docstring says so: no network, no API key,
  # no bundle load) -- pytest is the only requirement, and it is PINNED, since
  # it defines the gate.
  #
  # The suite uses `from __future__ import annotations` with PEP 585/604
  # syntax; 3.11 is the floor the Amplifier family targets and 3.13 is a
  # current minor. Cover the floor and the ceiling, not every step.
  #
  # A hang must fail LOUDLY and fast rather than sit burning runner time until
  # the 6h default: a job stuck at "in_progress" reads as "not done yet"
  # rather than "broken", which is how a false green gets merged.
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # No `enable-cache:` -- see the lint job for why.
      - uses: astral-sh/setup-uv@v4

      - name: Run the standing test command
        run: >
          uv run --isolated --no-project
          --python ${{ matrix.python-version }}
          --with pytest==9.1.1
          python -m pytest tests/ -q --tb=short

  # ────────────────────────────────────────────────────────────────────────
  # Bundle structure -- every YAML this bundle ships must parse and carry a
  # bundle.name. Nothing else in the repo parses bundle.md's frontmatter or
  # behaviors/*.yaml, so a malformed one currently ships silently and only
  # fails at session-composition time in a user's process.
  #
  # Kept inline rather than as a checked-in script because this PR
  # deliberately adds no file to the repo other than this workflow. Nothing
  # is interpolated into the Python source below (no ${{ }} inside the
  # heredoc, and the heredoc delimiter is quoted) -- a repo path interpolated
  # into Python source is how a sibling repo turned a backslash-a into BEL
  # and got a silent empty result with exit 0.
  # ────────────────────────────────────────────────────────────────────────
  bundle-structure:
    name: Bundle structure (YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --quiet 'PyYAML>=6.0'

      - name: Parse bundle.md frontmatter and behaviors/*.yaml
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          root = pathlib.Path.cwd()
          failures: list[str] = []
          checked = 0

          bundle_md = root / "bundle.md"
          if not bundle_md.is_file():
              failures.append("bundle.md is missing")
          else:
              text = bundle_md.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  failures.append("bundle.md: no YAML frontmatter (file does not open with '---')")
              else:
                  end = text.find("\n---", 3)
                  if end == -1:
                      failures.append("bundle.md: frontmatter opened but never closed")
                  else:
                      data = None
                      try:
                          data = yaml.safe_load(text[4 : end + 1])
                          checked += 1
                      except yaml.YAMLError as exc:
                          failures.append("bundle.md frontmatter: " + str(exc))
                      if data is not None:
                          name = data.get("bundle", {}).get("name") if isinstance(data, dict) else None
                          if not name:
                              failures.append("bundle.md frontmatter: missing bundle.name")
                          else:
                              print("OK  bundle.md  (bundle.name=" + str(name) + ")")

          behaviors = sorted((root / "behaviors").glob("*.yaml"))
          if not behaviors:
              failures.append(
                  "behaviors/*.yaml matched NOTHING -- a structure gate that checks zero files is decoration"
              )
          for path in behaviors:
              # .as_posix(), not str(): str() emits OS-native separators.
              rel = path.relative_to(root).as_posix()
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
                  checked += 1
              except yaml.YAMLError as exc:
                  failures.append(rel + ": " + str(exc))
                  continue
              name = data.get("bundle", {}).get("name") if isinstance(data, dict) else None
              if not name:
                  failures.append(rel + ": missing bundle.name")
              else:
                  print("OK  " + rel + "  (bundle.name=" + str(name) + ")")

          # The DTU profiles this bundle ships are YAML too, and a malformed
          # one fails only when a user launches an environment. Parse them
          # here; they carry no bundle.name, so only parseability is asserted.
          profiles = sorted((root / ".amplifier").rglob("*.yaml"))
          for path in profiles:
              rel = path.relative_to(root).as_posix()
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  checked += 1
              except yaml.YAMLError as exc:
                  failures.append(rel + ": " + str(exc))
                  continue
              print("OK  " + rel + "  (parses)")

          print("")
          print(str(checked) + " YAML document(s) parsed.")
          if failures:
              print("")
              print("FAILURES:")
              for item in failures:
                  print("  - " + item)
              sys.exit(1)
          print("Bundle structure OK.")
          PY
